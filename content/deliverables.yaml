# This file is the MANUAL source of truth for each WORKSTREAM's status
# (see docs/ARCHITECTURE.md ADR-3). Auto-gathered GitHub activity is shown
# alongside these but never overrides the status set here.
#
# A workstream rolls up gathered activity (by `id`, see config.yaml) and holds
# one or more contract MILESTONES (Mx.y). Ongoing work has no milestones.
#
# status:  not-started | in-progress | done | blocked
# quarter: Q3-2026 | Q4-2026 | ongoing
# Update `statusUpdatedAt` (YYYY-MM-DD) whenever you change a status.
#
# Milestones carry the contract schedule:
#   dueDate:       committed deadline (YYYY-MM-DD), or omit if there is no date.
#   deliveredDate: when it was actually delivered (YYYY-MM-DD); omit until then.
#   evidence / acceptanceCriteria / team / thirdPartyAssurance: from the
#     contract milestone table. Stored for the record; not yet shown in the UI.

