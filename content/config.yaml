# Site-wide configuration for the Hydra tracker.
site:
  title: Hydra
  tagline: A transparent, weekly-updated tracker for Hydra.
  description: >-
    Track delivery of Hydra: deliverable status, milestones, and weekly progress.
  repoUrl: "https://github.com/cardano-scaling/hydra-updates"
  url: "https://cardano-scaling.github.io/hydra-updates"

proposal:
  treasuryAskAda: 5100781
  windowStart: Q3-2026
  windowEnd: Q4-2026
  lead: Noon van der Silk and Sharan Konerira
  collaborators: []

roster:
  - noonio
  - v0d1ch
  - vrom911
  - ch1bo

# Curated repositories the gatherer tracks (ADR-4). Feeds scripts/gather.ts,
# the Links page, and the repo chips on each deliverable page. Each declares:
#   deliverable:  which deliverable (M2…M6) its activity rolls up to, or null
#                 to fall into the "Other / Reactive" bucket (ADR-6).
#   teamOnly:     true for shared/external repos — count only activity authored
#                 by a roster member (ADR-5); false (default) for owned repos.
#   milestoneMap: optional GitHub-milestone-title → deliverable id. Routes an
#                 individual PR/issue away from `deliverable`, so one repo can
#                 feed several workstreams (ADR-6). Unmilestoned items, and
#                 release milestones like "2.2.1", fall back to `deliverable`.
repos:
  # Almost all Hydra work lands here and spans M2…M5, so it defaults to the
  # Reactive bucket and relies on milestones for per-workstream attribution.
  - url: "https://github.com/cardano-scaling/hydra"
    deliverable: null
    teamOnly: false
    milestoneMap:
      "Performance": M2
      "Operational Excellence": M3
      "Ecosystem Support": M4
      "Maintenance and DevX": M5
  - url: "https://github.com/cardano-scaling/hydra-explorer"
    deliverable: M5
    teamOnly: false
  - url: "https://github.com/cardano-scaling/hydra-updates"
    deliverable: M6
    teamOnly: false

# Curated jump-off points shown on the Links hub.
links:
  - label: Hydra documentation
    url: "https://hydra.family/head-protocol/"
  - label: Cardano Developer Portal
    url: "https://developers.cardano.org"


otherTrackers:
  - label: Cardano DevX Initiative
    url: "https://input-output-hk.github.io/devx-updates/"
