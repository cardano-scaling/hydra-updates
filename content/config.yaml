# Site-wide configuration for the DevX Initiative tracker.
site:
  title: Cardano DevX Initiative
  tagline: A transparent, weekly-updated tracker for a funded Cardano Developer Experience program.
  description: >-
    Track delivery of Input Output's funded Cardano Developer Experience
    Initiative: deliverable status, milestones, and weekly progress.
  repoUrl: "https://github.com/rober-m/devx-updates"

proposal:
  treasuryAskAda: 3601926
  treasuryAskUsd: 864462
  windowStart: Q3-2026
  windowEnd: Q4-2026
  lead: Robertino Martinez
  collaborators:
    - Intersect Developer Advocate Program
    - TxPipe

# GitHub logins of team members. Used to attribute contributions in shared
# repos (ADR-5). Placeholder — replace with the real roster.
roster:
  - rober-m

# Curated repositories the gatherer tracks (ADR-4). Each declares:
#   deliverable: which deliverable (D1…D8) its activity rolls up to, or null
#                to fall into the "Other / Reactive" bucket (ADR-6).
#   teamOnly:    true for shared/external repos — count only activity authored
#                by a roster member (ADR-5); false (default) for owned repos.
# Placeholder list — replace URLs with the initiative's real public repos.
repos:
  - url: "https://github.com/input-output-hk/cardano-init"
    deliverable: D3
    teamOnly: false
  - url: "https://github.com/input-output-hk/contracts-library"
    deliverable: D5
    teamOnly: false
  - url: "https://github.com/cardano-foundation/developer-portal"
    deliverable: D4
    teamOnly: true

# Curated jump-off points shown on the Links hub (built in a later slice).
links:
  - label: Cardano Developer Portal
    url: "https://developers.cardano.org"
  - label: Cardano Discord
    url: "https://discord.gg/cardano"
