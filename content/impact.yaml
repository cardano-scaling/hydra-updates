# Impact — ecosystem outcomes the initiative aims to move but does not directly
# control. Two families:
#   direct    — an onboarding experiment run before and after the strategy.
#   ecosystem — proxy metrics relative to competitors (difference-in-differences).
#   past      — proxy metrics relative to Cardano's own past performance.
#
# NOTE: the `ecosystem` series below are ILLUSTRATIVE placeholders so the charts
# render. Replace the points with real measurements as they come in and set
# `illustrative: false`. Fill the `past` baseline/target values once measured.

direct:
  title: Onboarding difficulty
  summary: >-
    The headline question is how hard it is to onboard a new developer to Cardano.
    We measure it directly with two identical online hackathons — one before the
    strategy is implemented and one after — then compare the time, effort, and
    outcomes to estimate the change in developer experience.
  method: Two identical online hackathons · before and after · compared via interviews, code reviews, and results
  characteristics:
    - Online and two weeks long, to cut costs and reach a wider audience.
    - Promoted in other ecosystems without revealing that it is a Cardano hackathon.
    - A ~$10,000 prize plus help taking the winning MVP to a real product.
    - Vetted candidates — strong web and/or blockchain developers, new to Cardano.
    - Only public documentation, tooling, and libraries are provided; no other support.
    - A secret, ecosystem-useful project — buildable by a Cardano-familiar developer in about one week, requiring smart-contract design plus on-chain and off-chain implementation, and thoroughly specified to avoid ambiguity.
    - Exit interviews with a fixed set of qualitative and quantitative questions, plus a code review and evaluation of every project.

ecosystem:
  note: >-
    We measure growth relative to the overall blockchain ecosystem and to direct
    competitors, using the relative growth rate (a difference-in-differences
    technique) so that industry-wide factors — regulation, market conditions —
    are not mistaken for the strategy's effect. Each metric targets a 30%+
    acceleration versus the baseline.
  source: "https://x.com/theroberm/status/2047686383565738346?s=20"
  controls:
    - Ethereum
    - Solana
  targetPct: 30
  metrics:
    - name: New developers
      yLabel: New developers (indexed to 100 at program start)
      illustrative: true
      series:
        - name: Cardano
          points:
